<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/hw-js-10/1-timer.js"></script>
    <link rel="modulepreload" crossorigin href="/hw-js-10/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/hw-js-10/assets/vendor-BbSUbo7J.js">
    <link rel="stylesheet" crossorigin href="/hw-js-10/assets/vendor-C1gPI-5C.css">
    <link rel="stylesheet" crossorigin href="/hw-js-10/assets/styles-cgPG86dr.css">
  </head>
  <body>
    <main>
      <div class="container container-title-timer">
        <h1 class="main-title">
          <span class="main-title-gradient">Welcome</span> to Timer
        </h1>
      </div>
      <input type="text" id="datetime-picker" />
      <button type="button" data-start class="start-btn">Start</button>

      <div class="timer">
        <div class="field">
          <span class="value" data-days>00</span>
          <span class="label">Days</span>
        </div>
        <div class="field">
          <span class="value" data-hours>00</span>
          <span class="label">Hours</span>
        </div>
        <div class="field">
          <span class="value" data-minutes>00</span>
          <span class="label">Minutes</span>
        </div>
        <div class="field">
          <span class="value" data-seconds>00</span>
          <span class="label">Seconds</span>
        </div>
      </div>

      <a href="./index.html" class="back-link">Go back</a>
    </main>
  </body>
</html>
